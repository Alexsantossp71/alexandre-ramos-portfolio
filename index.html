<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandre Ramos | Portfólio</title>
    <meta name="description" content="Portfólio de Alexandre Ramos — projetos, contato e Redação Nota 1000.">
    <meta name="author" content="Alexandre Ramos">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f172a;
            --bg-card: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #34d399;
            --accent-strong: #059669;
            --radius: 16px;
            --shadow: 0 10px 25px rgba(0,0,0,0.3);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #fafafa;
                --bg-card: #ffffff;
                --text: #0f172a;
                --text-muted: #64748b;
                --border: #e2e8f0;
                --accent: #059669;
                --accent-strong: #047857;
                --shadow: 0 10px 25px rgba(0,0,0,0.08);
            }
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        a { color: inherit; text-decoration: none; }

        .container {
            width: 100%;
            max-width: 28rem;
            text-align: center;
        }

        .avatar {
            width: 88px;
            height: 88px;
            margin: 0 auto 1.25rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #fff;
            font-size: 2.25rem;
            font-weight: 800;
            box-shadow: var(--shadow);
        }

        .name { font-size: clamp(2rem, 6vw, 2.5rem); font-weight: 800; letter-spacing: -0.02em; }
        .role { margin-top: 0.35rem; color: var(--text-muted); font-size: 1rem; }

        .email {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.25rem;
            padding: 0.55rem 1.1rem;
            border-radius: 999px;
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .email:hover { color: var(--accent); }
        .email-icon { width: 16px; height: 16px; }
        .email-border {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .email-border-base {
            fill: none;
            stroke: var(--border);
            stroke-width: 1.5;
        }
        .email-border-comet {
            fill: none;
            stroke: var(--accent);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 12 88;
            stroke-dashoffset: 0;
            filter: drop-shadow(0 0 4px var(--accent));
            animation: border-run-comet 3s linear infinite;
        }
        @keyframes border-run-comet {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -100; }
        }
        .email:hover {
            color: var(--accent);
            box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 40%, transparent);
        }

        .featured {
            margin-top: 2.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: all 0.25s;
        }
        .featured:hover { transform: translateY(-3px); border-color: var(--accent); }
        .featured-label {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent);
        }
        .featured-label svg { width: 14px; height: 14px; }
        .featured-title { margin-top: 0.5rem; font-size: 1.25rem; font-weight: 700; }
        .featured-desc { margin-top: 0.4rem; font-size: 0.9rem; color: var(--text-muted); }
        .featured-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.1rem;
            padding: 0.7rem 1.5rem;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            transition: opacity 0.2s, transform 0.2s;
        }
        .featured-link:hover { opacity: 0.9; transform: translateY(-1px); }
        .featured-link svg { width: 16px; height: 16px; }

        footer { margin-top: 2.5rem; font-size: 0.8rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">AR</div>
        <h1 class="name">Alexandre Ramos</h1>
        <p class="role">Desenvolvedor · Criador de projetos com propósito</p>

        <a href="mailto:alexramos.dev@gmail.com" class="email">
            <svg class="email-border" id="email-border" aria-hidden="true">
                <rect class="email-border-base" x="1.5" y="1.5" rx="0" pathLength="100" vector-effect="non-scaling-stroke"/>
                <rect class="email-border-comet" x="1.5" y="1.5" rx="0" pathLength="100" vector-effect="non-scaling-stroke"/>
            </svg>
            <svg class="email-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            alexramos.dev@gmail.com
        </a>

        <div class="featured">
            <span class="featured-label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
                Em destaque
            </span>
            <h2 class="featured-title">Redação Nota 1000</h2>
            <p class="featured-desc">Portal de redação para o ENEM com aulas, biblioteca e corretor de IA.</p>
            <a href="https://redacao-nota-1000.vercel.app" target="_blank" rel="noopener noreferrer" class="featured-link">
                Acessar
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
            </a>
        </div>

        <footer>&copy; <span id="year"></span> Alexandre Ramos</footer>
    </div>

    <script>
        function setupEmailBorder() {
            var el = document.querySelector('.email');
            var svg = document.getElementById('email-border');
            if (!el || !svg) return;
            var w = el.offsetWidth;
            var h = el.offsetHeight;
            var rx = h / 2 - 1.5;
            svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
            svg.setAttribute('width', w);
            svg.setAttribute('height', h);
            svg.style.width = w + 'px';
            svg.style.height = h + 'px';
            var rects = svg.querySelectorAll('rect');
            for (var i = 0; i < rects.length; i++) {
                rects[i].setAttribute('width', w - 3);
                rects[i].setAttribute('height', h - 3);
                rects[i].setAttribute('rx', Math.max(0, rx));
            }
        }
        setupEmailBorder();
        window.addEventListener('resize', setupEmailBorder);
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
